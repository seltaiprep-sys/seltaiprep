<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <defs>
    <filter id="sketch">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.8"/>
    </filter>
    <style>
      .title { font-family: 'Caveat', 'Patrick Hand', cursive; font-size: 28px; font-weight: 700; fill: #1a1a1a; }
      .label { font-family: 'Caveat', 'Patrick Hand', cursive; font-size: 19px; font-weight: 600; fill: #1a1a1a; }
      .stroke { stroke: #1a1a1a; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stage { fill: #f5efe0; stroke: #1a1a1a; stroke-width: 2; }
      .stage-alt { fill: #e8dcc0; stroke: #1a1a1a; stroke-width: 2; }
      .arrow { stroke: #1a1a1a; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" class="title">{{title}}</text>

  <!-- Stage 1: Trees / Harvesting -->
  <g transform="translate(90, 130) rotate(-1)">
    <rect width="160" height="110" rx="8" class="stage" filter="url(#sketch)"/>
    <!-- Two small trees -->
    <line x1="40" y1="60" x2="40" y2="88" class="stroke"/>
    <path d="M 40 42 L 22 68 L 58 68 Z" class="stage-alt"/>
    <line x1="110" y1="60" x2="110" y2="88" class="stroke"/>
    <path d="M 110 42 L 92 68 L 128 68 Z" class="stage-alt"/>
    <text x="80" y="100" text-anchor="middle" class="label">{{label_1}}</text>
  </g>

  <!-- Arrow 1→2 -->
  <path d="M 260 185 Q 290 185 305 185" class="arrow"/>

  <!-- Stage 2: Wood chips -->
  <g transform="translate(320, 130) rotate(1.5)">
    <rect width="160" height="110" rx="8" class="stage" filter="url(#sketch)"/>
    <!-- Wood chips -->
    <polygon points="40,60 55,55 60,70 45,75" class="stage-alt"/>
    <polygon points="70,65 85,60 90,75 75,80" class="stage-alt"/>
    <polygon points="100,60 115,55 120,72 105,77" class="stage-alt"/>
    <polygon points="55,85 70,80 75,95 60,100" class="stage-alt"/>
    <polygon points="90,85 105,80 110,95 95,100" class="stage-alt"/>
    <text x="80" y="103" text-anchor="middle" class="label">{{label_2}}</text>
  </g>

  <!-- Arrow 2→3 -->
  <path d="M 490 185 Q 520 185 535 185" class="arrow"/>

  <!-- Stage 3: Pulping (big vat) -->
  <g transform="translate(550, 130) rotate(-0.8)">
    <rect width="160" height="110" rx="8" class="stage" filter="url(#sketch)"/>
    <ellipse cx="80" cy="55" rx="48" ry="14" class="stage-alt"/>
    <path d="M 32 55 L 40 88 L 120 88 L 128 55" class="stroke-thin" stroke="#1a1a1a" stroke-width="1.6" fill="#e8dcc0"/>
    <text x="80" y="103" text-anchor="middle" class="label">{{label_3}}</text>
  </g>

  <!-- Arrow 3→4 -->
  <path d="M 630 260 Q 630 300 630 330" class="arrow"/>

  <!-- Stage 4: Bleaching / chemicals -->
  <g transform="translate(550, 350) rotate(1)">
    <rect width="160" height="110" rx="8" class="stage" filter="url(#sketch)"/>
    <circle cx="60" cy="55" r="18" class="stage-alt"/>
    <circle cx="100" cy="55" r="18" class="stage-alt"/>
    <text x="80" y="103" text-anchor="middle" class="label">{{label_4}}</text>
  </g>

  <!-- Arrow 4→5 -->
  <path d="M 490 405 Q 460 405 445 405" class="arrow"/>

  <!-- Stage 5: Pressing & Drying -->
  <g transform="translate(270, 350) rotate(-1.2)">
    <rect width="160" height="110" rx="8" class="stage" filter="url(#sketch)"/>
    <!-- Two rollers -->
    <circle cx="55" cy="60" r="20" class="stage-alt"/>
    <circle cx="105" cy="60" r="20" class="stage-alt"/>
    <rect x="60" y="62" width="40" height="8" fill="#f5efe0" stroke="#1a1a1a"/>
    <text x="80" y="103" text-anchor="middle" class="label">{{label_5}}</text>
  </g>

  <!-- Arrow 5→6 -->
  <path d="M 210 405 Q 180 405 165 405" class="arrow"/>

  <!-- Stage 6: Rolling into paper -->
  <g transform="translate(20, 350) rotate(1.5)">
    <rect width="160" height="110" rx="8" class="stage" filter="url(#sketch)"/>
    <circle cx="60" cy="55" r="22" class="stage-alt"/>
    <circle cx="60" cy="55" r="10" class="stroke-thin" fill="none"/>
    <rect x="90" y="45" width="55" height="30" rx="3" class="stage-alt"/>
    <text x="80" y="103" text-anchor="middle" class="label">{{label_6}}</text>
  </g>

  <!-- Arrow 6→7 (final packaging) -->
  <path d="M 180 470 Q 250 490 320 490" class="arrow"/>

  <!-- Stage 7: Packaged paper -->
  <g transform="translate(340, 480) rotate(-0.5)">
    <rect width="160" height="90" rx="8" class="stage" filter="url(#sketch)"/>
    <!-- Stack of sheets -->
    <line x1="40" y1="55" x2="120" y2="55" class="stroke"/>
    <line x1="40" y1="62" x2="120" y2="62" class="stroke"/>
    <line x1="40" y1="70" x2="120" y2="70" class="stroke"/>
    <text x="80" y="88" text-anchor="middle" class="label">{{label_7}}</text>
  </g>
</svg>