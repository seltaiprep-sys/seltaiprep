<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <!-- Hand-drawn sketch filter -->
  <defs>
    <filter id="sketch">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.8"/>
    </filter>
    <style>
      .title { font-family: 'Caveat', 'Patrick Hand', cursive; font-size: 28px; font-weight: 700; fill: #1a1a1a; }
      .label { font-family: 'Caveat', 'Patrick Hand', cursive; font-size: 20px; font-weight: 600; fill: #1a1a1a; }
      .small { font-family: 'Caveat', 'Patrick Hand', cursive; font-size: 16px; fill: #333; }
      .stroke { stroke: #1a1a1a; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-thin { stroke: #1a1a1a; stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .fill-sky { fill: #e8f4fb; stroke: #1a1a1a; stroke-width: 2; }
      .fill-water { fill: #cfe7f2; stroke: #1a1a1a; stroke-width: 2; }
      .fill-land { fill: #efe6d4; stroke: #1a1a1a; stroke-width: 2; }
      .fill-cloud { fill: #f5f5f5; stroke: #1a1a1a; stroke-width: 2.2; }
      .arrow { stroke: #1a1a1a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background (paper) -->
  <rect width="900" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" class="title">{{title}}</text>

  <!-- Sky area -->
  <path d="M 60 90 Q 450 70 840 90 L 840 400 Q 450 415 60 400 Z" class="fill-sky" filter="url(#sketch)"/>

  <!-- Sun (top left) -->
  <circle cx="140" cy="145" r="34" class="fill-cloud" fill="#fdf6d8"/>
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round">
    <line x1="140" y1="90" x2="140" y2="72"/>
    <line x1="140" y1="200" x2="140" y2="218"/>
    <line x1="85" y1="145" x2="67" y2="145"/>
    <line x1="195" y1="145" x2="213" y2="145"/>
    <line x1="101" y1="106" x2="88" y2="93"/>
    <line x1="179" y1="184" x2="192" y2="197"/>
    <line x1="101" y1="184" x2="88" y2="197"/>
    <line x1="179" y1="106" x2="192" y2="93"/>
  </g>

  <!-- Cloud 1 -->
  <path d="M 330 155 q 15 -35 50 -30 q 15 -25 55 -15 q 25 -20 55 5 q 30 -5 45 20 q 25 15 5 35 q -25 15 -70 12 q -40 8 -70 0 q -40 5 -70 -2 q -25 -5 0 -25 Z"
        class="fill-cloud" filter="url(#sketch)"/>
  <text x="400" y="148" text-anchor="middle" class="label">{{label_2}}</text>

  <!-- Rain lines from cloud 1 -->
  <g class="stroke-thin" opacity="0.75">
    <line x1="355" y1="180" x2="345" y2="215"/>
    <line x1="375" y1="182" x2="365" y2="217"/>
    <line x1="395" y1="180" x2="385" y2="215"/>
    <line x1="415" y1="182" x2="405" y2="217"/>
    <line x1="435" y1="180" x2="425" y2="215"/>
    <line x1="455" y1="182" x2="445" y2="217"/>
  </g>

  <!-- Mountain / land -->
  <path d="M 60 400 Q 200 320 320 360 Q 420 340 520 380 Q 620 340 740 360 Q 800 350 840 380 L 840 540 L 60 540 Z"
        class="fill-land" filter="url(#sketch)"/>

  <!-- River from mountains to sea -->
  <path d="M 560 400 Q 600 440 640 470 Q 690 490 740 500 Q 790 510 840 505"
        class="stroke" stroke-width="3.5" fill="none"/>

  <!-- Ocean / water body (bottom right) -->
  <path d="M 600 520 q 40 -8 80 0 q 40 8 80 0 q 40 -8 80 0 L 840 600 L 600 600 Z"
        class="fill-water" filter="url(#sketch)"/>

  <!-- Wavy water lines -->
  <g class="stroke-thin">
    <path d="M 620 545 q 20 -6 40 0 q 20 6 40 0 q 20 -6 40 0 q 20 6 40 0"/>
    <path d="M 620 565 q 20 -6 40 0 q 20 6 40 0 q 20 -6 40 0 q 20 6 40 0"/>
  </g>
  <text x="740" y="585" text-anchor="middle" class="label">{{label_4}}</text>

  <!-- Evaporation arrows from ocean going up -->
  <path d="M 700 500 Q 680 420 660 300 Q 640 220 620 180" class="arrow" fill="none"/>
  <text x="625" y="360" text-anchor="start" class="small">{{label_1}}</text>

  <!-- Condensation arrow (cloud 1) -->
  <path d="M 490 240 Q 460 200 420 175" class="arrow" fill="none"/>
  <text x="475" y="215" text-anchor="start" class="small">{{label_3}}</text>

  <!-- Runoff arrow from land back to ocean -->
  <path d="M 400 470 Q 480 495 570 505" class="arrow" fill="none"/>
  <text x="420" y="465" text-anchor="start" class="small">{{label_5}}</text>

  <!-- Small tree for context -->
  <g transform="translate(180, 400) rotate(-2)">
    <line x1="0" y1="0" x2="0" y2="30" class="stroke-thin"/>
    <circle cx="0" cy="-10" r="22" class="fill-sky" fill="#d4e8d4"/>
    <circle cx="-10" cy="-4" r="14" class="fill-sky" fill="#d4e8d4" opacity="0.8"/>
  </g>
</svg>