{% extends 'ukvi_b2b/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 60px auto;">
    <div style="text-align: center; margin-bottom: 25px;">
        <div style="font-size: 48px;">🏛️</div>
        <h2 style="color: #1e40af; margin: 10px 0 5px;">Institute Login</h2>
        <p style="color: #6b7280; font-size: 13px;">Access your B2B UKVI dashboard</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required autofocus
                   placeholder="institute@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required
                   placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <p style="text-align: center; margin-top: 20px; font-size: 12px; color: #6b7280;">
        Don't have an account? Contact admin to register.
    </p>
</div>
{% endblock %}
