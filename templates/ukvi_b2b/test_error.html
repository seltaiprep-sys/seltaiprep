<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — UKVI Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 20px; text-align: center;
        }
        .card {
            background: white; border-radius: 16px; padding: 40px 30px;
            max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon { font-size: 64px; margin-bottom: 15px; }
        h1 { color: #991b1b; font-size: 22px; margin-bottom: 15px; }
        p { color: #6b7280; line-height: 1.6; font-size: 15px; }
        .info {
            background: #f3f4f6; padding: 15px; border-radius: 10px;
            margin-top: 20px; font-size: 13px; color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>{{ error }}</h1>
        <p>{{ message }}</p>
        <div class="info">
            Need help?<br>
            Contact your institute for assistance.
        </div>
    </div>
</body>
</html>
