<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — UKVI Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 20px;
        }
        .card {
            background: white; border-radius: 16px; padding: 32px 28px;
            max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon { font-size: 48px; text-align: center; margin-bottom: 8px; }
        h1 { color: #1e40af; font-size: 22px; text-align: center; margin-bottom: 8px; }
        p.subtitle { color: #6b7280; font-size: 14px; text-align: center; margin-bottom: 24px; line-height: 1.5; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block; margin-bottom: 6px; font-size: 13px;
            font-weight: 600; color: #4b5563;
        }
        input {
            width: 100%; padding: 12px; border: 2px solid #e5e7eb;
            border-radius: 8px; font-size: 15px; font-family: inherit;
        }
        input:focus { outline: none; border-color: #1e40af; }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: #1e40af; color: white; font-size: 15px;
            font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #1e3a8a; }
        .info {
            background: #dbeafe; padding: 12px; border-radius: 8px;
            margin-top: 16px; font-size: 12px; color: #1e40af; line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📝</div>
        <h1>Create Your Account</h1>
        <p class="subtitle">
            Hello <strong>{{ student.full_name }}</strong>,<br>
            Set your login credentials to begin.
        </p>
        
        <form method="POST" action="{{ url_for('ukvi_b2b_test_register', token=student.test_token) }}">
            <div class="form-group">
                <label>Username *</label>
                <input type="text" name="username" required minlength="3" 
                       maxlength="40" pattern="[a-zA-Z0-9._-]+"
                       placeholder="e.g., ram_thapa"
                       title="Letters, numbers, dot, underscore, hyphen only">
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" name="password" required minlength="6"
                       placeholder="Minimum 6 characters">
            </div>
            <button type="submit">Continue →</button>
        </form>
        
        <div class="info">
            ℹ️ This test was scheduled by <strong>your institute</strong>.<br>
            Scheduled: <strong>{{ student.scheduled_date }} {{ student.scheduled_time.strftime('%H:%M') }} UTC</strong>
        </div>
    </div>
</body>
</html>
