<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeltaPrep — Loading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .splash-container {
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            animation: pulse 2s ease-in-out infinite;
        }
        .app-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 14px;
            opacity: 0.85;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 40px;
        }
        .loader {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="/static/icon-192.png" alt="SeltaPrep" class="logo">
        <div class="app-name">SeltaPrep</div>
        <div class="tagline">AI-Powered Exam Prep</div>
        <div class="loader"></div>
    </div>

    <script>
        // Redirect after animation (or after data load)
        setTimeout(() => {
            const params = new URLSearchParams(window.location.search);
            const target = params.get('next') || '/';
            window.location.replace(target);
        }, 1500);
    </script>
<script src="/static/js/push-notifications.js"></script>
</body>
</html>
